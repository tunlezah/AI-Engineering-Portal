# ==========================================================================
# Registry pipeline — ai-platform/harness-registry/.gitlab-ci.yml
#
# Three trigger modes:
#   1. incremental  — a harness pipeline finished and triggered us (fast path,
#                     re-indexes one project, ~40s to live site)
#   2. full         — scheduled reconciliation (hourly), crawls every group
#   3. content      — someone edited the registry itself (taxonomy, blueprints,
#                     governance records, theme)
#
# The snapshot is committed back to the `snapshot` branch by a bot so the index
# is diffable, reviewable, revertible and auditable — Git is the database.
# ==========================================================================

variables:
  REGISTRY_IMAGE: registry.acme.internal/ai-platform/harness-toolkit:1.8.2
  HUGO_IMAGE: registry.acme.internal/ai-platform/hugo-extended:0.148.1
  PAGEFIND_IMAGE: registry.acme.internal/ai-platform/pagefind:1.1.0
  SNAPSHOT_BRANCH: snapshot
  GIT_STRATEGY: clone

stages: [crawl, index, validate, build, verify, deploy]

default:
  image: $REGISTRY_IMAGE
  interruptible: false

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"     # triggered by a harness project
      variables: { MODE: incremental }
    - if: $CI_PIPELINE_SOURCE == "schedule"
      variables: { MODE: full }
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables: { MODE: content }
    - if: $CI_MERGE_REQUEST_IID
      variables: { MODE: content }

unit:
  stage: crawl
  script:
    - python3 -m pytest tests/ -q --junitxml=reports/junit.xml
    # The scoring rubric and lifecycle gates are the most contested part of the
    # system; they are unit-tested against fixtures on every run.
  artifacts: { when: always, reports: { junit: reports/junit.xml } }

# --------------------------------------------------------------------------
# 1. CRAWL — discover harnesses via the GitLab API (self-hosted, on-network)
#
# `sources.yaml` says which instance, which groups and which projects. When the
# harnesses live on a different GitLab from this pipeline, set gitlab.base_url
# there (or $REGISTRY_GITLAB_URL here) and give $REGISTRY_READ_TOKEN a token for
# *that* instance — $CI_JOB_TOKEN is scoped to this one and will not do.
# --------------------------------------------------------------------------
crawl:
  stage: crawl
  script:
    - |
      if [ "$MODE" = "incremental" ]; then
        registryctl crawl --sources sources.yaml \
                          --project "$UPSTREAM_HARNESS_PROJECT" \
                          --etag-cache .cache/etags.json --out crawl/
      else
        registryctl crawl --sources sources.yaml \
                          --etag-cache .cache/etags.json --out crawl/
      fi
  cache:
    key: crawl-etags
    paths: [.cache/etags.json]
  artifacts:
    paths: [crawl/]
    expire_in: 7 days

# --------------------------------------------------------------------------
# 2. INDEX — normalise, score, resolve relationships, emit the snapshot
# --------------------------------------------------------------------------
index:
  stage: index
  needs: [crawl]
  script:
    # Reference data (taxonomy, rubric, schema) comes from schema/; the sibling
    # registry exports and platform catalogues come from vendor/. Both are
    # committed, so an index run is reproducible from the repository alone.
    - registryctl index
        --schema schema/
        --vendor vendor/
        --crawl crawl/
        --governance governance/
        --out snapshot/
    - registryctl report --snapshot snapshot/
    # snapshot/ contains:
    #   registry.lock.yaml            id -> project, sha, tag, manifest digest
    #   harnesses/<id>.json           normalised card (spec + computed status)
    #   graph/edges.json              harness/skill/plugin/team edges
    #   evaluations/<id>/*.json       collected reports + trend series
    #   catalog.json                  compact facet/search payload
    #   reports/index-report.json     warnings, downgrades, orphans
  artifacts:
    paths: [snapshot/]
    reports: { dotenv: index.env }

index:commit:
  stage: index
  needs: [index]
  script:
    - registryctl snapshot-commit --branch $SNAPSHOT_BRANCH --snapshot snapshot/
    # No-op when the snapshot is byte-identical, so the history stays meaningful.
  rules:
    - if: $MODE != "content"

# --------------------------------------------------------------------------
# 3. VALIDATE — the registry's own quality gate
# --------------------------------------------------------------------------
validate:snapshot:
  stage: validate
  needs: [index]
  script:
    # Referential integrity, dependency cycles, duplicate ids — and the
    # mass-change guard, which fails the pipeline if more than 10% of harnesses
    # would disappear. An expired token must not silently empty the registry.
    - git fetch origin $SNAPSHOT_BRANCH && git worktree add .base origin/$SNAPSHOT_BRANCH
    - registryctl verify-snapshot --snapshot snapshot/ --base .base/ --max-removed-pct 10
  artifacts: { when: always, paths: [reports/], expire_in: 30 days }

validate:mr-comment:
  stage: validate
  needs: [index]
  script:
    # A registry MR (taxonomy, rubric, governance record) changes computed state
    # across the estate. Post the resulting diff on the MR so a reviewer sees
    # which harnesses move before merging, not after.
    - registryctl report --snapshot snapshot/ --full > reports/index-report.txt
    - registryctl post-mr-note reports/index-report.txt
  artifacts: { when: always, paths: [reports/] }
  rules: [{ if: $CI_MERGE_REQUEST_IID }]

# --------------------------------------------------------------------------
# 4. BUILD — content adapters turn the snapshot into pages, Hugo renders them
# --------------------------------------------------------------------------
build:site:
  stage: build
  needs: [index]
  image: $HUGO_IMAGE
  script:
    - registryctl emit-content --snapshot snapshot/ --site site/
    - cd site && hugo --minify --gc --destination public --baseURL "$REGISTRY_BASE_URL"
  artifacts: { paths: [site/public/], expire_in: 7 days }

build:search:
  stage: build
  needs: [build:site]
  image: $PAGEFIND_IMAGE
  script:
    # Full-text over rendered documentation. The compact facet payload
    # (catalog.json) is produced by the indexer and copied in by emit-content;
    # Pagefind never sees the metadata, and the browser never downloads the
    # full-text index unless a query needs it.
    - pagefind --site site/public --output-subdir _pagefind --force-language en
    - gzip -9 -k site/public/catalog.json
  artifacts: { paths: [site/public/], expire_in: 7 days }

# --------------------------------------------------------------------------
# 5. VERIFY — never ship a broken registry
# --------------------------------------------------------------------------
verify:site:
  stage: verify
  needs: [build:search]
  script:
    # Internal links, external-asset references (the check that makes "no CDN"
    # real rather than aspirational), page-weight and catalogue budgets, and a
    # static accessibility sample. All blocking.
    - registryctl verify-site --public site/public --max-page-kb 400 --max-catalog-mb 6 --a11y-sample 40
  artifacts: { when: always, paths: [reports/], expire_in: 30 days }

# --------------------------------------------------------------------------
# 6. DEPLOY — GitLab Pages
# --------------------------------------------------------------------------
pages:
  stage: deploy
  needs: [build:search, verify:site]
  script:
    - echo "Publishing $(find site/public -name '*.html' | wc -l) pages"
    - mv site/public public          # GitLab Pages serves the `public/` directory
  artifacts: { paths: [public/] }
  environment:
    name: registry
    url: $REGISTRY_BASE_URL
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $MODE == "incremental"
    - if: $MODE == "full"

pages:review:
  stage: deploy
  needs: [build:search]
  script: [mv site/public public]
  artifacts: { paths: [public/] }
  pages:
    path_prefix: "mr-$CI_MERGE_REQUEST_IID"
  environment:
    name: review/mr-$CI_MERGE_REQUEST_IID
    url: $REGISTRY_BASE_URL/mr-$CI_MERGE_REQUEST_IID/
    on_stop: pages:review:stop
  rules: [{ if: $CI_MERGE_REQUEST_IID }]

pages:review:stop:
  stage: deploy
  script: [registryctl pages-delete "mr-$CI_MERGE_REQUEST_IID"]
  environment: { name: review/mr-$CI_MERGE_REQUEST_IID, action: stop }
  when: manual
  rules: [{ if: $CI_MERGE_REQUEST_IID }]
