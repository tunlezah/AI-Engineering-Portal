apiVersion: harness.registry.acme.internal/v1
kind: EvaluationSuite
id: golden
kind_of: golden
description: >
  Hand-labelled first-pass reviews of 180 real contracts, anonymised and cleared
  by Legal for internal evaluation use. Labels are the consensus of two qualified
  lawyers; disagreements were adjudicated by a third and are retained as
  `contested: true` cases scored separately.

dataset:
  id: golden-contracts
  version: v4
  location: datasets/golden-contracts/     # LFS pointers; data never leaves the repo
  size: 180
  checksum: "sha256:9f2c1ab63d4e58c07b21f4ea5d3c9871ee40b6a2c5f83d19be7a04cc21f6d5e8"
  provenance: hand-labelled
  classification: confidential
  refresh_policy: "20 new contracts per quarter; retire cases older than 3 years."

cases_selector: "datasets/golden-contracts/cases/*.yaml"

metrics:

  - id: clause_f1
    kind: deterministic
    description: "Macro F1 of clause type classification against lawyer labels."
    implementation: evaluations/metrics/clause_f1.py
    unit: ratio
    direction: higher-is-better

  - id: severity_agreement
    kind: deterministic
    description: "Exact-match agreement on severity, weighted: high/medium errors count double."
    implementation: evaluations/metrics/severity_agreement.py
    unit: ratio
    direction: higher-is-better

  - id: citation_grounding
    kind: deterministic
    description: "Share of findings whose evidence string appears verbatim in the source and whose citation ids were all retrieved."
    implementation: evaluations/metrics/grounding.py
    unit: ratio
    direction: higher-is-better

  - id: hallucinated_citations
    kind: deterministic
    description: "Share of findings citing a position id that was never retrieved."
    implementation: evaluations/metrics/grounding.py#hallucinated
    unit: ratio
    direction: lower-is-better

  - id: rationale_quality
    kind: model-graded
    description: "Judge scores rationale usefulness 1-5 against the lawyer's own note."
    judge:
      model: claude-opus-5
      rubric: evaluations/rubrics/rationale-v3.md
      # Judge drift is itself a risk: the rubric is versioned, the judge model is
      # pinned, and a change to either is a MINOR release with a re-baselined run.
      calibration_set: evaluations/rubrics/rationale-calibration.yaml
      calibration_agreement_min: 0.80
    unit: score
    direction: higher-is-better

  - id: coverage
    kind: deterministic
    description: "Share of playbook positions applicable to the document that were assessed."
    implementation: evaluations/metrics/coverage.py
    unit: ratio
    direction: higher-is-better

execution:
  concurrency: 4
  seed: 20260719
  temperature: 0
  repeats: 3            # median reported; spread published as ci95
  timeout_per_case_s: 300
  models: [claude-sonnet-5, claude-opus-5]   # matrix; both reported, default gated
