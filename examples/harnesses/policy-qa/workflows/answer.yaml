apiVersion: harness.registry.acme.internal/v1
kind: Workflow
id: policy-qa
version: 1.4.0
inputs: [question, country]
steps:
  - id: redact
    guardrail: redact-employee-identifiers
    uses: code
    with: {script: workflows/steps/redact.py, types: [person, employee-id, email]}
  - id: retrieve
    uses: plugin:hr-policy-index@^0.9.0
    with: {query: "{{ steps.redact.text }}", filters: {country: "{{ inputs.country }}"}}
  - id: answer
    uses: model
    with: {prompt: prompts/answer.md, model: claude-sonnet-5}
  - id: cite
    guardrail: cite-policy-version
    uses: code
    with: {script: workflows/steps/cite.py}
  - id: filter
    guardrail: no-individual-advice
    uses: code
    with: {script: workflows/steps/advice_filter.py, rules: guardrails/no-advice.yaml}
outputs:
  answer: "{{ steps.filter.answer }}"
  citations: "{{ steps.cite.citations }}"
