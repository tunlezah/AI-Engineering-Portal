baseURL = "/"
languageCode = "en-gb"
title = "AI Harness Registry"
enableGitInfo = false
enableRobotsTXT = true
disableKinds = ["rss"]

# The site is generated from snapshot data; content/ holds only authored prose
# (blueprints, docs) plus the generated harness pages written by
# `registryctl emit-content`.
[params]
  description = "The engineering layer: complete, evaluated AI implementations that skills are built on."
  registry_repo = "https://gitlab.acme.internal/ai-platform/harness-registry"
  support_channel = "#ai-platform"
  # Everything is vendored; the build fails if a page references an external asset.
  offline = true

[taxonomies]
  business = "business"
  technical = "technical"
  lifecycle = "lifecycles"
  pattern = "patterns"
  team = "teams"
  owner = "owners"
  model = "models"
  plugin = "plugins"
  tag = "tags"

[permalinks]
  # Keys are the taxonomy's plural (its URL section), not the singular.
  [permalinks.term]
    business = "/categories/business/:slug/"
    technical = "/categories/technical/:slug/"
    lifecycles = "/categories/lifecycle/:slug/"
    patterns = "/reference-architectures/:slug/"
    teams = "/teams/:slug/"
    owners = "/owners/:slug/"
    models = "/categories/model/:slug/"
    plugins = "/categories/plugin/:slug/"
    tags = "/tags/:slug/"

[markup.goldmark.renderer]
  # Harness README and CHANGELOG text is rendered through Goldmark, and that
  # text comes from any project the crawler finds — it is not ours. With
  # unsafe = true a README containing <img src=x onerror=…> became stored XSS on
  # the harness page. Generated diagrams and charts never needed this: they are
  # emitted by templates (safeHTML on our own SVG), not by Markdown.
  unsafe = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[markup.highlight]
  noClasses = false
  guessSyntax = true

[pagination]
  pagerSize = 60

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  term = ["HTML"]

[menus]
  [[menus.main]]
    name = "Browse"
    url = "/browse/"
    weight = 10
  [[menus.main]]
    name = "Categories"
    url = "/categories/"
    weight = 20
  [[menus.main]]
    name = "Reference Architectures"
    url = "/reference-architectures/"
    weight = 30
  [[menus.main]]
    name = "Evaluations"
    url = "/evaluations/"
    weight = 40
  [[menus.main]]
    name = "Teams"
    url = "/teams/"
    weight = 50
  [[menus.main]]
    name = "Docs"
    url = "/docs/"
    weight = 60
  [[menus.main]]
    name = "Admin"
    url = "/admin/"
    weight = 70

# --------------------------------------------------------------------------
# Ecosystem — the sibling systems this registry sits between. They are separate
# products with separate URLs, so they are configuration, not content.
#
# Rules the templates enforce:
#   * an entry with a blank `url` is not rendered. An organisation that has no
#     AI Gallery blanks the url and gets no link, rather than a dead one;
#   * order is `weight`; the description is shown in the header menu and on the
#     home page, so keep it to one short sentence.
#
# To change these without editing this file — the usual case for a deployment
# that tracks upstream — put the replacement `[[menus.ecosystem]]` block in its
# own file and merge it at build time:
#
#   hugo --config hugo.toml,ecosystem.toml        (make site CONFIG=hugo.toml,ecosystem.toml)
#
# `ecosystem.example.toml` is a ready-made starting point. Config merging
# replaces the whole array, so the override file must list every link you want.
# --------------------------------------------------------------------------
  [[menus.ecosystem]]
    identifier = "plugin-marketplace"
    name = "Plugin Marketplace"
    url = "https://plugins.acme.internal/"
    weight = 10
    [menus.ecosystem.params]
      description = "Tools and connectors. A harness declares the ones it calls."
  [[menus.ecosystem]]
    identifier = "skills-marketplace"
    name = "Skills Marketplace"
    url = "https://skills.acme.internal/"
    weight = 20
    [menus.ecosystem.params]
      description = "Business capabilities. Each one is built on a harness."
  [[menus.ecosystem]]
    identifier = "prompt-library"
    name = "Prompt Library"
    url = "https://prompts.acme.internal/"
    weight = 30
    [menus.ecosystem.params]
      description = "Reusable instructions, to copy and adapt."
  [[menus.ecosystem]]
    identifier = "ai-gallery"
    name = "AI Gallery"
    url = "https://gallery.acme.internal/"
    weight = 40
    [menus.ecosystem.params]
      description = "What teams have shipped, demonstrated end to end."

[security.exec]
  allow = []
