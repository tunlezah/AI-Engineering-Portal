# Ecosystem links, as a merge-in config file.
#
# The four links in the header "Ecosystem" menu, the footer and the home page
# are configuration, not content. They ship in `hugo.toml` pointing at the
# fictional acme.internal hosts used throughout this repository; a real
# deployment points them at its own systems.
#
# Copy this file to `ecosystem.toml` (git-ignored), edit the URLs, and build
# with both configs:
#
#     make site CONFIG=hugo.toml,ecosystem.toml
#     hugo --source site --config hugo.toml,ecosystem.toml
#
# Hugo *replaces* an array when merging configs rather than appending to it, so
# list every link you want — an entry left out of this file disappears from the
# built site. Leaving a `url` blank has the same effect for that one entry,
# which is how you drop a system your organisation does not have: the templates
# skip blank URLs, so you get no link rather than a dead one.
#
# Adding a fifth system needs no template change — add another block.

[[menus.ecosystem]]
  identifier = "plugin-marketplace"
  name = "Plugin Marketplace"
  url = "https://plugins.example.com/"
  weight = 10
  [menus.ecosystem.params]
    description = "Tools and connectors. A harness declares the ones it calls."

[[menus.ecosystem]]
  identifier = "skills-marketplace"
  name = "Skills Marketplace"
  url = "https://skills.example.com/"
  weight = 20
  [menus.ecosystem.params]
    description = "Business capabilities. Each one is built on a harness."

[[menus.ecosystem]]
  identifier = "prompt-library"
  name = "Prompt Library"
  url = "https://prompts.example.com/"
  weight = 30
  [menus.ecosystem.params]
    description = "Reusable instructions, to copy and adapt."

[[menus.ecosystem]]
  identifier = "ai-gallery"
  name = "AI Gallery"
  url = ""     # not deployed here yet — blank, so no link is rendered
  weight = 40
  [menus.ecosystem.params]
    description = "What teams have shipped, demonstrated end to end."
