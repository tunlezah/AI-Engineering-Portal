# Groups the registry crawls. Adding a group here is the only registry-side
# configuration a new domain needs; individual projects register themselves by
# containing a harness.yaml.
groups:
  - ai-platform/harnesses/legal
  - ai-platform/harnesses/support
  - ai-platform/harnesses/finance
  - ai-platform/harnesses/engineering
  - ai-platform/harnesses/data
  - ai-platform/harnesses/people
  - ai-platform/harnesses/knowledge
  - ai-platform/harnesses/shared
  - ai-platform/harnesses/sandbox      # indexed, hidden from default browse

# Projects excluded regardless of a harness.yaml (templates, archived experiments).
exclude:
  - ai-platform/templates/harness-template
